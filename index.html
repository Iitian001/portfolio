<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The ?v= is load-bearing, not decoration. vercel.json tells browsers to
         cache anything ending in .ico or .svg for a day, and before the real
         icons existed the SPA rewrite answered /favicon.ico with index.html —
         so browsers cached an HTML document under the icon URL, and
         X-Content-Type-Options: nosniff forbids them from ever drawing it. The
         old purple favicon.svg was cached the same way. Changing the URL is the
         only thing that evicts those entries. Bump v on every icon change.

         favicon.ico is listed even though modern browsers prefer the SVG:
         crawlers, feed readers and older browsers request /favicon.ico blindly,
         with no chance to see this markup at all. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shreyash — Full Stack Developer & AI Engineer. Building robust web applications and intelligent systems." />
    <meta name="author" content="Shreyash Mishra" />
    <!-- One tag, no media attribute: the script below sets it from the theme
         actually in effect, which the two-tag prefers-color-scheme trick cannot
         do once a stored choice overrides the OS. -->
    <meta name="theme-color" content="#faf8f5" />

    <!-- Runs before the first paint, which is the whole point: applying the
         stored theme from React instead would paint the light palette and then
         repaint dark, so anyone who chose dark would see a white flash on every
         navigation. Inline and synchronous for the same reason.

         Only writes data-theme when there is a stored override — with the
         attribute absent the CSS keeps `color-scheme: light dark` and follows
         the OS live, which is what src/lib/theme.js expects. The two hex values
         are the --paper token for each theme; they are also in theme.js and
         sketchbook.css, and a pre-paint script cannot read either. -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) { /* privacy mode */ }
        if (stored !== 'light' && stored !== 'dark') stored = null;

        if (stored) document.documentElement.dataset.theme = stored;

        var dark = stored
          ? stored === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#14120f' : '#faf8f5');
      })();
    </script>

    <!-- Home-page defaults. Every route is served this same file, so usePageTitle
         rewrites the canonical and og:url below to the current path once React
         mounts — otherwise /projects and every detail page would declare the
         home page as their canonical URL. -->
    <link rel="canonical" href="https://shreyashmishra.in/" />

    <!-- Fonts are self-hosted (scripts/build-fonts.py writes public/fonts and
         src/styles/fonts.css). The Google Fonts <link> that used to sit here was
         render-blocking on a third-party origin: the browser could not learn a
         single font URL until a DNS lookup, a TLS handshake and a stylesheet
         round trip to fonts.googleapis.com had all finished, and the headline is
         Caveat, so that chain gated the largest text on the page.

         Only the two faces used above the fold are preloaded. Preloading all six
         would compete with the hero image for bandwidth to fetch the bold Kalam
         that no first screen needs. crossorigin is required even same-origin:
         fonts are fetched in CORS mode, and a preload without it is a second,
         unusable copy in the cache. -->
    <link rel="preload" href="/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/kalam-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- No <link rel="preload"> for the hero portrait: this single index.html is
         served for every route, so a static preload would download it on
         /projects, /certificates and every other page that never shows it. The
         <img> itself carries fetchpriority="high" instead. -->

    <meta property="og:title" content="Shreyash Mishra | Full Stack Developer & AI Engineer" />
    <meta property="og:description" content="Full Stack Developer & AI Engineer. Building robust web applications and intelligent systems." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shreyash Mishra" />
    <meta property="og:url" content="https://shreyashmishra.in/" />

    <!-- Purpose-built 1200x630 card (scripts/build-social-card.py), not the
         portrait: every platform crops a share image to roughly 1.91:1, which
         cut the 819x1024 portrait down to a band across the face. It stays a
         JPEG because several scrapers still refuse WebP. -->
    <meta property="og:image" content="https://shreyashmishra.in/social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shreyash Mishra — Full Stack Developer & AI Engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shreyash Mishra | Full Stack Developer & AI Engineer" />
    <meta name="twitter:description" content="Full Stack Developer & AI Engineer. Building robust web applications and intelligent systems." />
    <meta name="twitter:image" content="https://shreyashmishra.in/social-card.jpg" />
    <meta name="twitter:image:alt" content="Shreyash Mishra — Full Stack Developer & AI Engineer" />
    <title>Shreyash | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
