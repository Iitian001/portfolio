<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.ico is listed even though nothing links to it in modern browsers:
         crawlers, feed readers and older browsers request /favicon.ico blindly,
         and vercel.json rewrites unknown paths to this file, so without a real
         .ico they would receive HTML with an image content type. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shreyash — Full Stack Developer & AI Engineer. Building robust web applications and intelligent systems." />
    <meta name="author" content="Shreyash Mishra" />
    <meta name="theme-color" content="#faf8f5" />
    <!-- Home-page defaults. Every route is served this same file, so usePageTitle
         rewrites the canonical and og:url below to the current path once React
         mounts — otherwise /projects and every detail page would declare the
         home page as their canonical URL. -->
    <link rel="canonical" href="https://shreyashmishra.in/" />

    <!-- Fonts are loaded here rather than through a CSS @import: an @import inside
         a stylesheet can only start downloading after that stylesheet has arrived,
         which serialises two round trips before any text can render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400;700&display=swap"
    />

    <!-- No <link rel="preload"> for the hero portrait: this single index.html is
         served for every route, so a static preload would download it on
         /projects, /certificates and every other page that never shows it. The
         <img> itself carries fetchpriority="high" instead. -->

    <meta property="og:title" content="Shreyash Mishra | Full Stack Developer & AI Engineer" />
    <meta property="og:description" content="Full Stack Developer & AI Engineer. Building robust web applications and intelligent systems." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shreyash Mishra" />
    <meta property="og:url" content="https://shreyashmishra.in/" />

    <!-- Purpose-built 1200x630 card (scripts/build-social-card.py), not the
         portrait: every platform crops a share image to roughly 1.91:1, which
         cut the 819x1024 portrait down to a band across the face. It stays a
         JPEG because several scrapers still refuse WebP. -->
    <meta property="og:image" content="https://shreyashmishra.in/social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shreyash Mishra — Full Stack Developer & AI Engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shreyash Mishra | Full Stack Developer & AI Engineer" />
    <meta name="twitter:description" content="Full Stack Developer & AI Engineer. Building robust web applications and intelligent systems." />
    <meta name="twitter:image" content="https://shreyashmishra.in/social-card.jpg" />
    <meta name="twitter:image:alt" content="Shreyash Mishra — Full Stack Developer & AI Engineer" />
    <title>Shreyash | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
