<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Shreyash">
  <title>Shreyash</title>

  <!-- Hand-drawn tile. Deliberately wobbly rather than a plain rounded rect, to
       match the squiggly borders used across the site. The wobble is invisible
       at 16px and reads as pen-drawn at 512px, which is the point. -->
  <path fill="#1a1a1a" d="M16 2.5 C30 1.5 44 2 55 3.5 C60 4 62 8 61.5 16 C62.5 30 62 44 61 55 C60.5 60 56 62 48 61.5 C34 62.5 20 62 9 61 C4 60.5 2 56 2.5 48 C1.5 34 2 20 3 9 C3.5 4 8 2 16 2.5 Z"/>

  <!-- The S is a single open stroke, the way it would be written by hand, not a
       filled glyph. Round caps and joins keep the terminals soft at any size. -->
  <path fill="none" stroke="#faf8f5" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"
        d="M44 21 C42 14.5 29 12.5 22.5 17 C16 21.5 18.5 28 26 31.2 C33.5 34.4 44 35 44 42 C44 48.5 32 51.5 22 46.5"/>

  <!-- Marker underline. Thick enough that it survives the downscale to 16px as a
       single red dash instead of disappearing. -->
  <path fill="none" stroke="#d32f2f" stroke-width="4.5" stroke-linecap="round"
        d="M19 54 C26.5 52.5 36 55 45.5 53"/>
</svg>
